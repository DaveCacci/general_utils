[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "general_utils"
version = "0.1.0"
description = "Common Python utilities"
authors = [
  { name = "Davide Carecci", email = "davide.carecci@polimi.it" }
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "scipy",
]

[tool.setuptools.packages.find]
where = ["src"]